<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiurim R. Ariel Marcus</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia,serif;
    background:#f8f6f1;
    color:#2c3e50;
}

header{
    text-align:center;
    padding:60px 20px 40px;
}

h1{
    font-size:3rem;
    margin-bottom:10px;
}

.subtitle{
    font-size:1.1rem;
    color:#6c757d;
}

.grid{
    max-width:1200px;
    margin:auto;
    padding:20px 30px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:35px;
}

.card{
    display:block;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
    transition:.3s;
    text-decoration:none;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,.22);
}

.card img{
    width:100%;
    display:block;
}

</style>
</head>
<body>

<header>
    <h1>Shiurim R. Ariel Marcus</h1>
    <div class="subtitle">Biblioteca de Shiurim</div>
</header>

<div class="grid">

<a class="card" href="01-orchot-yosher.xml">
    <img src="orchot-yosher.png" alt="Orchot Yosher">
</a>

<a class="card" href="02-siftei-chaim.xml">
    <img src="siftei-chaim.png" alt="Siftei Chaim">
</a>

<a class="card" href="chovot-halevavot.xml">
    <img src="chovot-halevavot.jpg" alt="Chovot Halevavot">
</a>

<a class="card" href="shearim-betfila.xml">
    <img src="shearim-betfila.jpg" alt="Shearim Betfila">
</a>

<a class="card" href="shaarei-teshuva.xml">
    <img src="shaarei-teshuva.jpg" alt="Shaarei Teshuva">
</a>

<a class="card" href="5min-shmirat-halashon.xml">
    <img src="5min-shmirat-halashon.jpg" alt="5 Min Shmirat Halashon">
</a>

</div>

</body>
</html>
